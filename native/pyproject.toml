[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tubify"
version = "1.0.0"
description = "Tubify, a desktop app for YouTube Music"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  # Essentials has every Qt module Tubify uses; the full PySide6 adds WebEngine, 3D, Charts and more.
  "PySide6-Essentials>=6.8,<7",
  "keyring>=25.7,<26",
  "ytmusicapi>=1.12.3,<2",
  "yt-dlp[default]>=2026.8.19",
  "python-mpv>=1.0.8,<2",
  # Verifies signed Linux update packages (also used by yt-dlp).
  "pycryptodomex>=3.20,<4",
  "jeepney>=0.9,<1; sys_platform == 'linux'",
  "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
  "pyobjc-framework-MediaPlayer>=11; sys_platform == 'darwin'",
  "winrt-runtime>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Media>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Media.Interop>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3.2.1,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]
macos-build = ["pyinstaller>=6.10"]
windows-build = ["pyinstaller>=6.10"]

[project.scripts]
tubify = "tubify.launcher:main"
tubify-check = "tubify.launcher:compat_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tubify = ["qml/*.qml", "qml/*/*.qml", "qml/*.js", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
