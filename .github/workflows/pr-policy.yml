name: PR policy

# Runs on every PR, including ones the path-filtered Tubify checks skip.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-policy:
    name: Branch, title and base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Commit emails are checked across the whole PR.
          fetch-depth: 0
          persist-credentials: false
      - name: Check against the branch policy
        env:
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/open-prs.py --check-pr
