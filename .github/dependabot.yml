version: 2
updates:
  # Keeps native/uv.lock current through ordinary PRs into experimental.
  - package-ecosystem: uv
    directory: /native
    target-branch: experimental
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The release signing machine installs its one dependency from this hash-pinned file.
  - package-ecosystem: pip
    directory: /packaging
    target-branch: experimental
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # build-constraints.txt pins the build backend, which is raised deliberately.
      - dependency-name: setuptools
